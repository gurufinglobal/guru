# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: guru

before:
  hooks:
    - go mod download
    - go -C oracle mod download

builds:
  - id: gurud
    main: ./cmd/gurud
    binary: gurud
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # The current CGO toolchain/release policy supports Windows amd64 only.
      - goos: windows
        goarch: arm64
    tags:
      - netgo
    flags:
      - -mod=readonly
      - -p=2
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/cosmos/cosmos-sdk/version.Name=guru
        -X github.com/cosmos/cosmos-sdk/version.AppName=gurud
        -X github.com/cosmos/cosmos-sdk/version.Version={{ .Version }}
        -X github.com/cosmos/cosmos-sdk/version.Commit={{ .FullCommit }}
        -X github.com/cometbft/cometbft/version.TMCoreSemVer={{ .Env.TMVERSION }}
        -X github.com/cosmos/cosmos-sdk/version.BuildTags=netgo
    overrides:
      - goos: linux
        goarch: amd64
        goamd64: v1
        env:
          - CGO_ENABLED=1
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        goarm64: v8.0
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        goamd64: v1
        env:
          - CGO_ENABLED=1
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        goarm64: v8.0
        env:
          - CGO_ENABLED=1
          - CC=oa64-clang
          - CXX=oa64-clang++
      - goos: windows
        goarch: amd64
        goamd64: v1
        env:
          - CGO_ENABLED=1
          - CC=x86_64-w64-mingw32-gcc
          - CXX=x86_64-w64-mingw32-g++

  - id: oracled
    dir: oracle
    main: ./cmd/oracled
    binary: oracled
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    # oracled currently relies on Unix sockets and POSIX safe-file semantics.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -mod=readonly
      - -p=2
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/gurufinglobal/guru/oracle/internal/version.Version={{ .Version }}
        -X github.com/gurufinglobal/guru/oracle/internal/version.Commit={{ .FullCommit }}

archives:
  - id: gurud
    ids:
      - gurud
    formats:
      - tar.gz
    name_template: >-
      gurud_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: oracled
    ids:
      - oracled
    formats:
      - tar.gz
    name_template: >-
      oracled_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ .Version }}-next'

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
