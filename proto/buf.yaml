version: v1
name: buf.build/cosmos/evm
deps:
  - buf.build/cosmos/cosmos-sdk
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
  except:
    - UNARY_RPC
    - COMMENT_FIELD
    - SERVICE_SUFFIX
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - COMMENT_MESSAGE
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
  # Temporary bypass for this refactoring PR:
  # - FIELD_SAME_NAME: allow field renames (e.g. exchangeId -> exchange_id)
  # - FILE_SAME_GO_PACKAGE: allow go_package path changes
  #
  # NOTE: "FILE_SAME_PARAMETER" is not a valid buf breaking rule ID (buf v1.63.0),
  # so it cannot be configured here.
  except:
    - FIELD_SAME_NAME
    - FILE_SAME_GO_PACKAGE
