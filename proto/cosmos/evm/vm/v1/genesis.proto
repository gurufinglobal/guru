// Proto file for cosmos/evm vm module genesis state.
// Updated to match cosmos/evm v0.5.1 structure.
// NOTE: pb.go files are provided by the cosmos/evm external dependency.
// This file is kept for documentation and tooling only.

syntax = "proto3";
package cosmos.evm.vm.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/evm/vm/v1/evm.proto";

option go_package = "github.com/cosmos/evm/x/vm/types";

// GenesisState defines the evm module's genesis state.
message GenesisState {
  // accounts is an array containing the ethereum genesis accounts.
  repeated GenesisAccount accounts = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // params defines all the parameters of the module.
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // preinstalls defines a set of predefined contracts
  repeated Preinstall preinstalls = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// GenesisAccount defines an account to be initialized in the genesis state.
// Its main difference between with Geth's GenesisAccount is that it uses a
// custom storage type and that it doesn't contain the private key field.
message GenesisAccount {
  // address defines an ethereum hex formated address of an account
  string address = 1;
  // code defines the hex bytes of the account code.
  string code = 2;
  // storage defines the set of state key values for the account.
  repeated State storage = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.castrepeated) = "Storage"
  ];
}

// Preinstall defines a contract that is preinstalled on-chain with a specific
// contract address and bytecode.
message Preinstall {
  // name of the preinstall contract
  string name = 1;
  // address in hex format of the preinstall contract
  string address = 2;
  // code in hex format for the preinstall contract
  string code = 3;
}
