syntax = "proto3";

package guru.transwap.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "guru/transwap/v1/params.proto";
import "guru/transwap/v1/refund.proto";

option go_package = "github.com/gurufinglobal/guru/v3/api/guru/transwap/v1;transwapv1";

// Msg exposes governance configuration and refund recovery operations.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams replaces the refund retry policy through governance.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // RetryRefund dispatches a RETRYABLE refund with a fresh timeout.
  rpc RetryRefund(MsgRetryRefund) returns (MsgRetryRefundResponse);
  // ClaimRefund pays a MANUAL_CLAIMABLE refund to its receiver once.
  rpc ClaimRefund(MsgClaimRefund) returns (MsgClaimRefundResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2;
}
message MsgUpdateParamsResponse {}

// MsgRetryRefund permits any signer to resume a RETRYABLE refund.
message MsgRetryRefund {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string refund_id = 2;
}
message MsgRetryRefundResponse {
  RefundRecord refund = 1;
}

message MsgClaimRefund {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string refund_id = 2;
}
message MsgClaimRefundResponse {
  RefundRecord refund = 1;
}
