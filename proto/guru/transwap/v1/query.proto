syntax = "proto3";

package guru.transwap.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/query/v1/query.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "guru/transwap/v1/params.proto";
import "guru/transwap/v1/refund.proto";
import "guru/transwap/v1/token.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/ibc/transwap/types";

// Query provides defines the gRPC querier service.
service Query {
  // Params returns the effective refund retry governance parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/guru/transwap/v1/params";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Refunds returns stable refund state-machine records with optional status
  // and receiver filters. Keep this exact route before Refund's ** wildcard so
  // grpc-gateway dispatches the collection endpoint deterministically.
  rpc Refunds(QueryRefundsRequest) returns (QueryRefundsResponse) {
    option (google.api.http).get = "/guru/transwap/v1/refunds";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Refund returns one stable refund state-machine record.
  rpc Refund(QueryRefundRequest) returns (QueryRefundResponse) {
    option (google.api.http).get = "/guru/transwap/v1/refunds/{refund_id=**}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Denoms queries all denominations
  rpc Denoms(QueryDenomsRequest) returns (QueryDenomsResponse) {
    option (google.api.http).get = "/guru/transwap/v1/denoms";
  }

  // Denom queries a denomination
  rpc Denom(QueryDenomRequest) returns (QueryDenomResponse) {
    option (google.api.http).get = "/guru/transwap/v1/denoms/{hash=**}";
  }

  // DenomHash queries a denomination hash information.
  rpc DenomHash(QueryDenomHashRequest) returns (QueryDenomHashResponse) {
    option (google.api.http).get = "/guru/transwap/v1/denom_hashes/{trace=**}";
  }

  // EscrowAddress returns the escrow address for a particular port and channel id.
  rpc EscrowAddress(QueryEscrowAddressRequest) returns (QueryEscrowAddressResponse) {
    option (google.api.http).get = "/guru/transwap/v1/channels/{channel_id}/ports/{port_id}/escrow_address";
  }

  // TotalEscrowForDenom returns the total amount of tokens in escrow based on the denom.
  rpc TotalEscrowForDenom(QueryTotalEscrowForDenomRequest) returns (QueryTotalEscrowForDenomResponse) {
    option (google.api.http).get = "/guru/transwap/v1/total_escrow/{denom=**}";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}

message QueryRefundRequest {
  string refund_id = 1;
}
message QueryRefundResponse {
  RefundRecord refund = 1;
}

message QueryRefundsRequest {
  // status filters by one concrete refund state. UNSPECIFIED returns all
  // states.
  RefundStatus status = 1;
  // receiver is the exact cross-chain receiver stored in the refund record.
  // Empty returns all receivers.
  string receiver = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryRefundsResponse {
  repeated RefundRecord refunds = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryDenomRequest is the request type for the Query/Denom RPC
// method
message QueryDenomRequest {
  // hash (in hex format) or denom (full denom with ibc prefix) of the on chain denomination.
  string hash = 1;
}

// QueryDenomResponse is the response type for the Query/Denom RPC
// method.
message QueryDenomResponse {
  // denom returns the requested denomination.
  Denom denom = 1;
}

// QueryDenomsRequest is the request type for the Query/Denoms RPC
// method
message QueryDenomsRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryDenomsResponse is the response type for the Query/Denoms RPC
// method.
message QueryDenomsResponse {
  // denoms returns all denominations.
  repeated Denom denoms = 1 [
    (gogoproto.castrepeated) = "Denoms",
    (gogoproto.nullable) = false
  ];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryDenomHashRequest is the request type for the Query/DenomHash RPC
// method
message QueryDenomHashRequest {
  // The denomination trace ([port_id]/[channel_id])+/[denom]
  string trace = 1;
}

// QueryDenomHashResponse is the response type for the Query/DenomHash RPC
// method.
message QueryDenomHashResponse {
  // hash (in hex format) of the denomination trace information.
  string hash = 1;
}

// QueryEscrowAddressRequest is the request type for the EscrowAddress RPC method.
message QueryEscrowAddressRequest {
  // unique port identifier
  string port_id = 1;
  // unique channel identifier
  string channel_id = 2;
}

// QueryEscrowAddressResponse is the response type of the EscrowAddress RPC method.
message QueryEscrowAddressResponse {
  // the escrow account address
  string escrow_address = 1;
}

// QueryTotalEscrowForDenomRequest is the request type for TotalEscrowForDenom RPC method.
message QueryTotalEscrowForDenomRequest {
  string denom = 1;
}

// QueryTotalEscrowForDenomResponse is the response type for TotalEscrowForDenom RPC method.
message QueryTotalEscrowForDenomResponse {
  cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
}
