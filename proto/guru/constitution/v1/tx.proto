syntax = "proto3";
package guru.constitution.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "guru/constitution/v1/params.proto";
import "guru/constitution/v1/types.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/constitution/types";

// Msg defines constitution module transaction services.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a governance operation for updating the parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateBaseAddress updates base address controlled by the moderator.
  rpc UpdateBaseAddress(MsgUpdateBaseAddress) returns (MsgUpdateBaseAddressResponse);

  // UpdateModeratorAddress updates moderator address controlled by the
  // moderator.
  rpc UpdateModeratorAddress(MsgUpdateModeratorAddress) returns (MsgUpdateModeratorAddressResponse);

  // UpdateSeparationRatio updates separation ratio controlled by the moderator.
  rpc UpdateSeparationRatio(MsgUpdateSeparationRatio) returns (MsgUpdateSeparationRatioResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2;
}

message MsgUpdateParamsResponse {}

message MsgUpdateBaseAddress {
  option (cosmos.msg.v1.signer) = "moderator";

  string moderator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string base_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgUpdateBaseAddressResponse {}

message MsgUpdateModeratorAddress {
  option (cosmos.msg.v1.signer) = "moderator";

  string moderator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string moderator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgUpdateModeratorAddressResponse {}

message MsgUpdateSeparationRatio {
  option (cosmos.msg.v1.signer) = "moderator";

  string moderator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  SeparationRatio separation_ratio = 2;
}
message MsgUpdateSeparationRatioResponse {}
