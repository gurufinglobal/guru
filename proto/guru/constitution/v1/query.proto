syntax = "proto3";
package guru.constitution.v1;

import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";
import "guru/constitution/v1/params.proto";
import "guru/constitution/v1/types.proto";

option go_package = "github.com/gurufinglobal/guru/v3/api/guru/constitution/v1;constitutionv1";

// Query exposes read-only constitution module state.
service Query {
  // Params returns constitution module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/guru/constitution/v1/params";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // BaseAddress returns the configured fee separation base address.
  rpc BaseAddress(QueryBaseAddressRequest) returns (QueryBaseAddressResponse) {
    option (google.api.http).get = "/guru/constitution/v1/base_address";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // ModeratorAddress returns the current constitution moderator address.
  rpc ModeratorAddress(QueryModeratorAddressRequest) returns (QueryModeratorAddressResponse) {
    option (google.api.http).get = "/guru/constitution/v1/moderator_address";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // SeparationRatio returns the current fee separation ratio.
  rpc SeparationRatio(QuerySeparationRatioRequest) returns (QuerySeparationRatioResponse) {
    option (google.api.http).get = "/guru/constitution/v1/separation_ratio";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // MinGasPrice returns the current feemarket minimum gas price and any
  // pending constitution-scheduled update.
  rpc MinGasPrice(QueryMinGasPriceRequest) returns (QueryMinGasPriceResponse) {
    option (google.api.http).get = "/guru/constitution/v1/min_gas_price";
    option (cosmos.query.v1.module_query_safe) = true;
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1;
}

message QueryBaseAddressRequest {}

message QueryBaseAddressResponse {
  string base_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message QueryModeratorAddressRequest {}

message QueryModeratorAddressResponse {
  string moderator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message QuerySeparationRatioRequest {}

message QuerySeparationRatioResponse {
  SeparationRatio separation_ratio = 1;
}

message QueryMinGasPriceRequest {}

message QueryMinGasPriceResponse {
  string current_min_gas_price = 1;
  MinGasPriceSchedule pending = 2;
}
