syntax = "proto3";
package guru.constitution.v1;

option go_package = "github.com/gurufinglobal/guru/v3/api/guru/constitution/v1;constitutionv1";

// SeparationRatio values are expressed in parts per million (ppm).
// The _ppm suffix means 1,000,000 ppm is exactly 100%.
// The sum of all ratio fields must be exactly 1,000,000.
message SeparationRatio {
  uint32 base_ppm = 1;
  uint32 burn_ppm = 2;
  uint32 validators_ppm = 3;
}
