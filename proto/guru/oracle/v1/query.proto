syntax = "proto3";
package guru.oracle.v1;

import "cosmos/query/v1/query.proto";
import "google/api/annotations.proto";
import "guru/oracle/v1/oracle.proto";
import "guru/oracle/v1/params.proto";

option go_package = "github.com/gurufinglobal/guru/v3/api/guru/oracle/v1;oraclev1";

service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/guru/oracle/v1/params";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  rpc ActiveTasks(QueryActiveTasksRequest) returns (QueryActiveTasksResponse) {
    option (google.api.http).get = "/guru/oracle/v1/tasks";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  rpc ExchangeRate(QueryExchangeRateRequest)
      returns (QueryExchangeRateResponse) {
    option (google.api.http).get = "/guru/oracle/v1/exchange_rates/{symbol}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  rpc ExchangeRates(QueryExchangeRatesRequest)
      returns (QueryExchangeRatesResponse) {
    option (google.api.http).get = "/guru/oracle/v1/exchange_rates";
    option (cosmos.query.v1.module_query_safe) = true;
  }
}

message QueryParamsRequest {}
message QueryParamsResponse { Params params = 1; }

message QueryActiveTasksRequest {}
message QueryActiveTasksResponse { repeated OracleTask tasks = 1; }

message QueryExchangeRateRequest { string symbol = 1; }
message QueryExchangeRateResponse { OracleResult rate = 1; }

message QueryExchangeRatesRequest {}
message QueryExchangeRatesResponse { repeated OracleResult rates = 1; }