syntax = "proto3";
package guru.oracle.v1;

import "cosmos/query/v1/query.proto";
import "google/api/annotations.proto";
import "guru/oracle/v1/oracle.proto";
import "guru/oracle/v1/params.proto";

option go_package = "github.com/gurufinglobal/guru/v3/api/guru/oracle/v1;oraclev1";

// Query exposes read-only oracle state.
service Query {
  // Params returns oracle module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/guru/oracle/v1/params";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // ActiveTasks returns configured oracle tasks.
  rpc ActiveTasks(QueryActiveTasksRequest) returns (QueryActiveTasksResponse) {
    option (google.api.http).get = "/guru/oracle/v1/tasks";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Task returns a configured oracle task by symbol.
  rpc Task(QueryTaskRequest) returns (QueryTaskResponse) {
    option (google.api.http).get = "/guru/oracle/v1/tasks/{symbol}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // LatestValue returns the latest accepted oracle value for a symbol.
  rpc LatestValue(QueryLatestValueRequest) returns (QueryLatestValueResponse) {
    option (google.api.http).get = "/guru/oracle/v1/values/{symbol}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // LatestValues returns all latest accepted oracle values.
  rpc LatestValues(QueryLatestValuesRequest) returns (QueryLatestValuesResponse) {
    option (google.api.http).get = "/guru/oracle/v1/values";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // History returns bounded oracle value history for a symbol.
  rpc History(QueryHistoryRequest) returns (QueryHistoryResponse) {
    option (google.api.http).get = "/guru/oracle/v1/history/{symbol}";
    option (cosmos.query.v1.module_query_safe) = true;
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}

message QueryActiveTasksRequest {}
message QueryActiveTasksResponse {
  repeated OracleTask tasks = 1;
}

message QueryTaskRequest {
  string symbol = 1;
}
message QueryTaskResponse {
  OracleTask task = 1;
}

message QueryLatestValueRequest {
  string symbol = 1;
}
message QueryLatestValueResponse {
  OracleValue value = 1;
}

message QueryLatestValuesRequest {}
message QueryLatestValuesResponse {
  repeated OracleValue values = 1;
}

message QueryHistoryRequest {
  string symbol = 1;
}
message QueryHistoryResponse {
  OracleHistory history = 1;
}
