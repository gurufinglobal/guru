syntax = "proto3";
package guru.oracle.v1;

import "guru/oracle/v1/oracle.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/oracle/types";

// OracleSidecar exposes fresh, locally aggregated oracle values to validators.
service OracleSidecar {
  // GetAggregates returns fresh aggregate results for requested symbols.
  rpc GetAggregates(GetAggregatesRequest) returns (GetAggregatesResponse);
}

message GetAggregatesRequest {
  repeated string symbols = 1;
}

message GetAggregatesResponse {
  repeated AggregatedResult results = 1;
}
