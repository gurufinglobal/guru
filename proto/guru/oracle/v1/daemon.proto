syntax = "proto3";
package guru.oracle.v1;

import "guru/oracle/v1/oracle.proto";

// 체인 상태(KVStore)와 무관하지만 Go 타입 생성을 위해 동일한 패키지 지정
option go_package = "github.com/gurufinglobal/guru/v3/api/guru/oracle/v1;oraclev1";

// OracleSidecar exposes off-chain oracle samples to validator nodes.
service OracleSidecar {
  // GetSamples returns source-level samples grouped by oracle symbol.
  rpc GetSamples(GetSamplesRequest) returns (GetSamplesResponse);
}

message GetSamplesRequest {
  repeated OracleTask tasks = 1;
  int64 height = 2;
}

message GetSamplesResponse {
  repeated OracleSymbolSamples symbols = 1;
}
