syntax = "proto3";
package guru.oracle.v1;

import "guru/oracle/v1/oracle.proto";

// 체인 상태(KVStore)와 무관하지만 Go 타입 생성을 위해 동일한 패키지 지정
option go_package = "github.com/gurufinglobal/guru/v3/api/guru/oracle/v1;oraclev1";

service OracleSidecar {
  rpc GetLatestValues(GetLatestValuesRequest) returns (GetLatestValuesResponse);
}

message GetLatestValuesRequest { repeated string symbols = 1; }

message GetLatestValuesResponse { repeated OracleResult results = 1; }