syntax = "proto3";

package guru.example.v1;

import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "guru/example/v1/types.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/example/types";

// Query defines x/example gRPC query service.
service Query {
  // Params queries x/example module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/guru/example/v1/params";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Project queries a project by id.
  rpc Project(QueryProjectRequest) returns (QueryProjectResponse) {
    option (google.api.http).get = "/guru/example/v1/projects/{project_id}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Projects queries projects with optional owner filter.
  rpc Projects(QueryProjectsRequest) returns (QueryProjectsResponse) {
    option (google.api.http).get = "/guru/example/v1/projects";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // ProjectMembers queries project members by project id.
  rpc ProjectMembers(QueryProjectMembersRequest) returns (QueryProjectMembersResponse) {
    option (google.api.http).get = "/guru/example/v1/projects/{project_id}/members";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Task queries a task by id.
  rpc Task(QueryTaskRequest) returns (QueryTaskResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/{task_id}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // TaskByExternalRef queries a task by unique external reference.
  rpc TaskByExternalRef(QueryTaskByExternalRefRequest) returns (QueryTaskByExternalRefResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/external/{external_ref}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // TasksByProject queries tasks by project.
  rpc TasksByProject(QueryTasksByProjectRequest) returns (QueryTasksByProjectResponse) {
    option (google.api.http).get = "/guru/example/v1/projects/{project_id}/tasks";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // TasksByAssignee queries tasks by assignee.
  rpc TasksByAssignee(QueryTasksByAssigneeRequest) returns (QueryTasksByAssigneeResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/assignees/{assignee}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // TasksByStatus queries tasks by status.
  rpc TasksByStatus(QueryTasksByStatusRequest) returns (QueryTasksByStatusResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/status/{status}";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // ExpiringTasks queries tasks with due_at earlier than or equal to before.
  rpc ExpiringTasks(QueryExpiringTasksRequest) returns (QueryExpiringTasksResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/expiring";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // TaskEvents queries append-only task events by task id.
  rpc TaskEvents(QueryTaskEventsRequest) returns (QueryTaskEventsResponse) {
    option (google.api.http).get = "/guru/example/v1/tasks/{task_id}/events";
    option (cosmos.query.v1.module_query_safe) = true;
  }

  // Statistics queries aggregate counters for observability demo.
  rpc Statistics(QueryStatisticsRequest) returns (QueryStatisticsResponse) {
    option (google.api.http).get = "/guru/example/v1/statistics";
    option (cosmos.query.v1.module_query_safe) = true;
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryProjectRequest {
  uint64 project_id = 1;
}

message QueryProjectResponse {
  Project project = 1 [(gogoproto.nullable) = false];
}

message QueryProjectsRequest {
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool include_archived = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryProjectsResponse {
  repeated Project projects = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryProjectMembersRequest {
  uint64 project_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryProjectMembersResponse {
  repeated ProjectMember members = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTaskRequest {
  uint64 task_id = 1;
}

message QueryTaskResponse {
  Task task = 1 [(gogoproto.nullable) = false];
}

message QueryTaskByExternalRefRequest {
  string external_ref = 1;
}

message QueryTaskByExternalRefResponse {
  Task task = 1 [(gogoproto.nullable) = false];
}

message QueryTasksByProjectRequest {
  uint64 project_id = 1;
  TaskStatus status_filter = 2;
  string assignee = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 4;
}

message QueryTasksByProjectResponse {
  repeated Task tasks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTasksByAssigneeRequest {
  string assignee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryTasksByAssigneeResponse {
  repeated Task tasks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTasksByStatusRequest {
  TaskStatus status = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryTasksByStatusResponse {
  repeated Task tasks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryExpiringTasksRequest {
  google.protobuf.Timestamp before = 1 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryExpiringTasksResponse {
  repeated Task tasks = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTaskEventsRequest {
  uint64 task_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryTaskEventsResponse {
  repeated TaskEvent task_events = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryStatisticsRequest {}

message QueryStatisticsResponse {
  uint64 project_count = 1;
  uint64 task_count = 2;
  uint64 task_event_count = 3;
  uint64 todo_count = 4;
  uint64 in_progress_count = 5;
  uint64 blocked_count = 6;
  uint64 done_count = 7;
}
