syntax = "proto3";

package guru.example.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/example/types";

// Params defines x/example module parameters.
message Params {
  // max_projects_per_owner limits how many projects a single owner can create.
  uint32 max_projects_per_owner = 1;

  // max_members_per_project limits project membership size.
  uint32 max_members_per_project = 2;

  // max_tasks_per_project limits task count per project.
  uint32 max_tasks_per_project = 3;
}

// MemberRole is the role of a project member.
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_VIEWER = 1;
  MEMBER_ROLE_EDITOR = 2;
  MEMBER_ROLE_ADMIN = 3;
}

// TaskStatus is the lifecycle status of a task.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_TODO = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_BLOCKED = 3;
  TASK_STATUS_DONE = 4;
  TASK_STATUS_ARCHIVED = 5;
}

// Project is the primary state object for project management.
message Project {
  uint64 id = 1;
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  string description = 4;
  string metadata_json = 5;
  bool archived = 6;
  google.protobuf.Timestamp created_at = 7 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  google.protobuf.Timestamp updated_at = 8 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
}

// ProjectMember stores project membership and role information.
message ProjectMember {
  uint64 project_id = 1;
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  MemberRole role = 3;
  google.protobuf.Timestamp joined_at = 4 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
}

// Task is the primary task state object.
message Task {
  uint64 id = 1;
  uint64 project_id = 2;

  // external_ref is a globally unique external reference for advanced indexing demo.
  string external_ref = 3;

  string title = 4;
  string description = 5;
  string creator = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string assignee = 7 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  TaskStatus status = 8;
  uint32 priority = 9;
  repeated string labels = 10;
  string metadata_json = 11;
  google.protobuf.Timestamp due_at = 12 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  google.protobuf.Timestamp created_at = 13 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  google.protobuf.Timestamp updated_at = 14 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
}

// TaskEvent stores append-only task event logs.
message TaskEvent {
  uint64 id = 1;
  uint64 task_id = 2;
  uint64 project_id = 3;
  string actor = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string event_type = 5;
  string payload_json = 6;
  google.protobuf.Timestamp created_at = 7 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
}
