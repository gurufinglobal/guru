syntax = "proto3";

package guru.example.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/gurufinglobal/guru/v3/x/example/types";

// Module is the config object of x/example.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/gurufinglobal/guru/v3/x/example"};

  // authority defines the module authority address (default: x/gov module account).
  string authority = 1;
}
