name: Tests

on:
  merge_group:
  pull_request:
    branches:
      - main
      - dev-v2.1
      - release/**
  push:
    branches:
      - main
      - dev-v2.1
      - release/**
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            oracle/go.sum

      - name: Verify modules
        run: make mod-check

      - name: Run tests with coverage
        run: make test-cover

      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profiles
          path: build/coverage/*.out
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and version smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            oracle/go.sum

      - name: Build and validate embedded versions
        run: make version-smoke

  extended:
    name: Race and fuzz tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            oracle/go.sum

      - name: Run race tests
        run: make test-race

      - name: Run Oracle fuzz tests
        run: make test-fuzz-oracle FUZZ_TIME=30s
